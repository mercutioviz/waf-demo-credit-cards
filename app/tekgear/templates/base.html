<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tek Gear{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a href="{{ url_for('shop.index') }}">
      <img src="{{ url_for('static', filename='brand/logo.svg') }}" alt="Tek Gear" height="36">
    </a>
    <nav>
      <a href="{{ url_for('shop.index') }}">Shop</a>
      <a href="{{ url_for('shop.checkout_form') }}">Checkout</a>
      <a href="{{ url_for('ops.dashboard') }}">Ops</a>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    Tek Gear demonstration environment. No real payment data is processed here.
  </footer>
</body>
</html>
